services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: monchantier
      POSTGRES_PASSWORD: monchantier
      POSTGRES_DB: monchantier
    ports:
      - "5432:5432"
    volumes:
      - monchantier_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monchantier"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  monchantier_pgdata:
