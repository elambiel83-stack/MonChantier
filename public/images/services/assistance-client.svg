<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Assistance client — MonChantier</title>
  <desc id="desc">Service d'assistance client WhatsApp, téléphone et email</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#00000060"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="1200" height="720" fill="url(#bgGrad)"/>

  <!-- Cercles décoratifs de fond -->
  <circle cx="100" cy="100" r="200" fill="#10b981" fill-opacity="0.08"/>
  <circle cx="1100" cy="620" r="250" fill="#10b981" fill-opacity="0.06"/>
  <circle cx="900" cy="150" r="150" fill="#34d399" fill-opacity="0.05"/>

  <!-- === SMARTPHONE === -->
  <g filter="url(#shadow)">
    <!-- Corps du téléphone -->
    <rect x="350" y="100" width="220" height="420" rx="30" fill="url(#phoneGrad)"/>
    <!-- Bordure téléphone -->
    <rect x="355" y="105" width="210" height="410" rx="27" fill="none" stroke="#334155" stroke-width="4"/>
    <!-- Encoche -->
    <rect x="430" y="112" width="60" height="14" rx="7" fill="#334155"/>
    <!-- Écran -->
    <rect x="368" y="138" width="184" height="330" rx="10" fill="#0f4c29"/>
    <!-- Interface WhatsApp simplifiée -->
    <!-- Barre de statut -->
    <rect x="368" y="138" width="184" height="32" rx="10" fill="#128C7E"/>
    <circle cx="390" cy="154" r="12" fill="#25D366"/>
    <rect x="408" y="148" width="80" height="8" rx="4" fill="white" fill-opacity="0.8"/>
    <rect x="408" y="160" width="50" height="6" rx="3" fill="white" fill-opacity="0.4"/>
    <!-- Bulle message reçu -->
    <rect x="376" y="182" width="120" height="44" rx="12" fill="#1e293b"/>
    <rect x="376" y="182" width="120" height="44" rx="12" fill="white" fill-opacity="0.12"/>
    <rect x="384" y="192" width="90" height="8" rx="4" fill="white" fill-opacity="0.7"/>
    <rect x="384" y="206" width="60" height="8" rx="4" fill="white" fill-opacity="0.5"/>
    <!-- Bulle message envoyé -->
    <rect x="420" y="240" width="120" height="44" rx="12" fill="#25D366" fill-opacity="0.9"/>
    <rect x="428" y="250" width="90" height="8" rx="4" fill="white" fill-opacity="0.8"/>
    <rect x="428" y="264" width="60" height="8" rx="4" fill="white" fill-opacity="0.6"/>
    <!-- Bulle message reçu 2 -->
    <rect x="376" y="298" width="130" height="44" rx="12" fill="white" fill-opacity="0.1"/>
    <rect x="384" y="308" width="100" height="8" rx="4" fill="white" fill-opacity="0.7"/>
    <rect x="384" y="322" width="70" height="8" rx="4" fill="white" fill-opacity="0.5"/>
    <!-- Barre de saisie -->
    <rect x="372" y="440" width="160" height="22" rx="11" fill="#1e293b"/>
    <circle cx="540" cy="451" r="11" fill="#25D366"/>
    <!-- Bouton home -->
    <rect x="432" y="498" width="56" height="8" rx="4" fill="#334155"/>
  </g>

  <!-- === ICÔNE CASQUE À DROITE === -->
  <g filter="url(#shadow)" transform="translate(730, 180)">
    <!-- Arc du casque -->
    <path d="M 0,120 A 120,120 0 0,1 240,120" fill="none" stroke="#10b981" stroke-width="22" stroke-linecap="round"/>
    <!-- Écouteur gauche -->
    <rect x="-20" y="108" width="40" height="60" rx="12" fill="#10b981"/>
    <rect x="-12" y="118" width="24" height="40" rx="8" fill="#064e3b"/>
    <!-- Écouteur droit -->
    <rect x="220" y="108" width="40" height="60" rx="12" fill="#10b981"/>
    <rect x="228" y="118" width="24" height="40" rx="8" fill="#064e3b"/>
    <!-- Micro -->
    <path d="M 220,168 Q 250,180 250,220" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round"/>
    <circle cx="250" cy="230" r="14" fill="#10b981"/>
    <circle cx="250" cy="230" r="8" fill="#064e3b"/>
  </g>

  <!-- Bulles de communication flottantes -->
  <!-- Bulle 1 -->
  <g filter="url(#glow)">
    <rect x="780" y="420" width="160" height="60" rx="16" fill="#10b981" fill-opacity="0.9"/>
    <polygon points="780,450 760,460 780,466" fill="#10b981" fill-opacity="0.9"/>
    <rect x="800" y="438" width="100" height="8" rx="4" fill="white" fill-opacity="0.9"/>
    <rect x="800" y="454" width="70" height="8" rx="4" fill="white" fill-opacity="0.6"/>
  </g>
  <!-- Bulle 2 -->
  <g>
    <rect x="840" y="500" width="180" height="60" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#10b981" stroke-width="2"/>
    <polygon points="1020,530 1040,520 1020,536" fill="#1e293b" fill-opacity="0.9"/>
    <rect x="860" y="518" width="120" height="8" rx="4" fill="white" fill-opacity="0.7"/>
    <rect x="860" y="534" width="80" height="8" rx="4" fill="#10b981" fill-opacity="0.8"/>
  </g>

  <!-- Bandeau bas -->
  <rect x="0" y="620" width="1200" height="100" fill="#022c22" fill-opacity="0.8"/>
  <!-- Icônes de canaux -->
  <!-- WhatsApp -->
  <circle cx="250" cy="670" r="28" fill="#25D366"/>
  <text x="250" y="677" text-anchor="middle" font-family="Arial" font-size="22" font-weight="900" fill="white">W</text>
  <text x="308" y="666" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#34d399">WhatsApp</text>
  <text x="308" y="684" font-family="Arial, sans-serif" font-size="13" fill="#6ee7b7">+243 999 972 466</text>
  <!-- Email -->
  <circle cx="560" cy="670" r="28" fill="#f59e0b"/>
  <text x="560" y="677" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="white">@</text>
  <text x="618" y="666" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#fcd34d">Email</text>
  <text x="618" y="684" font-family="Arial, sans-serif" font-size="13" fill="#fde68a">contact@monchantier.net</text>
  <!-- Disponibilité -->
  <rect x="870" y="645" width="200" height="50" rx="25" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2"/>
  <circle cx="898" cy="670" r="8" fill="#10b981"/>
  <text x="916" y="675" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#6ee7b7">Disponible 7j/7</text>

  <!-- Titre principal -->
  <text x="100" y="590" font-family="Arial Black, Arial, sans-serif" font-size="26" font-weight="900" fill="#10b981">ASSISTANCE CLIENT</text>
  <text x="100" y="615" font-family="Arial, sans-serif" font-size="16" fill="#6ee7b7" fill-opacity="0.8">MonChantier · Kolwezi</text>
</svg>
