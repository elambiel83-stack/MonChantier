<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Carrelage — MonChantier</title>
  <desc id="desc">Pose de carreaux et faïences — MonChantier Kolwezi</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#164e63"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="4" stdDeviation="8" flood-color="#00000050"/>
    </filter>
    <filter id="tileShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-color="#00000040"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="1200" height="720" fill="url(#bgGrad)"/>
  <circle cx="1050" cy="120" r="200" fill="#0e7490" fill-opacity="0.15"/>
  <circle cx="150" cy="600" r="180" fill="#0e7490" fill-opacity="0.1"/>

  <!-- === SOL / ZONE DE POSE === -->
  <!-- Perspective sol -->
  <polygon points="0,480 1200,480 1200,720 0,720" fill="#94a3b8" fill-opacity="0.3"/>
  <polygon points="0,480 1200,480 1200,510 0,510" fill="#64748b" fill-opacity="0.4"/>

  <!-- === GRILLE DE CARREAUX POSÉS === -->
  <!-- Rangée 1 (complète) -->
  <!-- Carreaux blancs/beige -->
  <rect x="80" y="200" width="110" height="110" rx="3" fill="#f8fafc" filter="url(#tileShadow)"/>
  <rect x="82" y="202" width="106" height="106" rx="2" fill="#f1f5f9"/>
  <rect x="82" y="202" width="106" height="3" fill="white" fill-opacity="0.8"/>
  <rect x="82" y="202" width="3" height="106" fill="white" fill-opacity="0.8"/>

  <rect x="200" y="200" width="110" height="110" rx="3" fill="#f8fafc" filter="url(#tileShadow)"/>
  <rect x="202" y="202" width="106" height="106" rx="2" fill="#e2e8f0"/>
  <rect x="202" y="202" width="106" height="3" fill="white" fill-opacity="0.8"/>

  <!-- Carreau décoratif (accent) -->
  <rect x="320" y="200" width="110" height="110" rx="3" fill="#0e7490" filter="url(#tileShadow)"/>
  <rect x="322" y="202" width="106" height="106" rx="2" fill="#0891b2"/>
  <rect x="322" y="202" width="106" height="3" fill="white" fill-opacity="0.3"/>
  <rect x="322" y="202" width="3" height="106" fill="white" fill-opacity="0.3"/>
  <!-- Motif sur carreau accent -->
  <rect x="342" y="222" width="66" height="66" rx="2" fill="none" stroke="#67e8f9" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="342" y1="255" x2="408" y2="255" stroke="#67e8f9" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="375" y1="222" x2="375" y2="288" stroke="#67e8f9" stroke-width="1.5" stroke-opacity="0.4"/>

  <rect x="440" y="200" width="110" height="110" rx="3" fill="#f8fafc" filter="url(#tileShadow)"/>
  <rect x="442" y="202" width="106" height="106" rx="2" fill="#f1f5f9"/>

  <rect x="560" y="200" width="110" height="110" rx="3" fill="#f8fafc" filter="url(#tileShadow)"/>
  <rect x="562" y="202" width="106" height="106" rx="2" fill="#e2e8f0"/>

  <rect x="680" y="200" width="110" height="110" rx="3" fill="#0e7490" filter="url(#tileShadow)"/>
  <rect x="682" y="202" width="106" height="106" rx="2" fill="#0891b2"/>
  <rect x="702" y="222" width="66" height="66" rx="2" fill="none" stroke="#67e8f9" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="702" y1="255" x2="768" y2="255" stroke="#67e8f9" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="735" y1="222" x2="735" y2="288" stroke="#67e8f9" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Rangée 2 -->
  <rect x="80" y="320" width="110" height="110" rx="3" fill="#f8fafc" filter="url(#tileShadow)"/>
  <rect x="82" y="322" width="106" height="106" rx="2" fill="#e2e8f0"/>

  <rect x="200" y="320" width="110" height="110" rx="3" fill="#0e7490" filter="url(#tileShadow)"/>
  <rect x="202" y="322" width="106" height="106" rx="2" fill="#0891b2"/>
  <rect x="222" y="342" width="66" height="66" rx="2" fill="none" stroke="#67e8f9" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="222" y1="375" x2="288" y2="375" stroke="#67e8f9" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="255" y1="342" x2="255" y2="408" stroke="#67e8f9" stroke-width="1.5" stroke-opacity="0.4"/>

  <rect x="320" y="320" width="110" height="110" rx="3" fill="#f8fafc" filter="url(#tileShadow)"/>
  <rect x="322" y="322" width="106" height="106" rx="2" fill="#f1f5f9"/>

  <rect x="440" y="320" width="110" height="110" rx="3" fill="#f8fafc" filter="url(#tileShadow)"/>
  <rect x="442" y="322" width="106" height="106" rx="2" fill="#e2e8f0"/>

  <rect x="560" y="320" width="110" height="110" rx="3" fill="#0e7490" filter="url(#tileShadow)"/>
  <rect x="562" y="322" width="106" height="106" rx="2" fill="#0891b2"/>
  <rect x="582" y="342" width="66" height="66" rx="2" fill="none" stroke="#67e8f9" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="582" y1="375" x2="648" y2="375" stroke="#67e8f9" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="615" y1="342" x2="615" y2="408" stroke="#67e8f9" stroke-width="1.5" stroke-opacity="0.4"/>

  <rect x="680" y="320" width="110" height="110" rx="3" fill="#f8fafc" filter="url(#tileShadow)"/>
  <rect x="682" y="322" width="106" height="106" rx="2" fill="#f1f5f9"/>

  <!-- Joints (lignes entre carreaux) -->
  <!-- Joints verticaux rangée 1 -->
  <rect x="190" y="200" width="10" height="110" fill="#475569" fill-opacity="0.6"/>
  <rect x="310" y="200" width="10" height="110" fill="#475569" fill-opacity="0.6"/>
  <rect x="430" y="200" width="10" height="110" fill="#475569" fill-opacity="0.6"/>
  <rect x="550" y="200" width="10" height="110" fill="#475569" fill-opacity="0.6"/>
  <rect x="670" y="200" width="10" height="110" fill="#475569" fill-opacity="0.6"/>
  <!-- Joint horizontal -->
  <rect x="80" y="310" width="710" height="10" fill="#475569" fill-opacity="0.6"/>
  <!-- Joints verticaux rangée 2 -->
  <rect x="190" y="320" width="10" height="110" fill="#475569" fill-opacity="0.6"/>
  <rect x="310" y="320" width="10" height="110" fill="#475569" fill-opacity="0.6"/>
  <rect x="430" y="320" width="10" height="110" fill="#475569" fill-opacity="0.6"/>
  <rect x="550" y="320" width="10" height="110" fill="#475569" fill-opacity="0.6"/>
  <rect x="670" y="320" width="10" height="110" fill="#475569" fill-opacity="0.6"/>

  <!-- === CARREAU EN COURS DE POSE === -->
  <!-- Carreau levé avec colle en dessous -->
  <g transform="translate(800, 280) rotate(-8)" filter="url(#shadow)">
    <rect x="0" y="0" width="110" height="110" rx="3" fill="#f1f5f9"/>
    <rect x="2" y="2" width="106" height="106" rx="2" fill="#e2e8f0"/>
    <rect x="2" y="2" width="106" height="3" fill="white" fill-opacity="0.9"/>
    <rect x="2" y="2" width="3" height="106" fill="white" fill-opacity="0.9"/>
  </g>
  <!-- Colle/mortier sous le carreau -->
  <ellipse cx="862" cy="415" rx="60" ry="12" fill="#94a3b8" fill-opacity="0.5"/>

  <!-- === TRUELLE === -->
  <g transform="translate(880, 120) rotate(35)" filter="url(#shadow)">
    <!-- Manche -->
    <rect x="0" y="0" width="16" height="120" rx="8" fill="#92400e"/>
    <rect x="3" y="0" width="10" height="120" rx="5" fill="#b45309"/>
    <!-- Lame -->
    <ellipse cx="8" cy="145" rx="28" ry="40" fill="#94a3b8"/>
    <ellipse cx="8" cy="145" rx="24" ry="36" fill="#cbd5e1"/>
    <!-- Mortier sur lame -->
    <ellipse cx="8" cy="148" rx="18" ry="22" fill="#94a3b8" fill-opacity="0.7"/>
    <!-- Reflet lame -->
    <line x1="-10" y1="120" x2="-5" y2="178" stroke="white" stroke-width="3" stroke-opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- Badge service -->
  <g transform="translate(970, 80)">
    <rect x="0" y="0" width="180" height="80" rx="12" fill="#0c4a6e" fill-opacity="0.95" stroke="#0e7490" stroke-width="2"/>
    <text x="90" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#67e8f9" letter-spacing="2">SERVICE</text>
    <text x="90" y="52" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="20" font-weight="900" fill="white">CARRELAGE</text>
    <text x="90" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Pose professionnelle</text>
  </g>

  <!-- Titre bas -->
  <rect x="0" y="630" width="1200" height="90" fill="#0c4a6e" fill-opacity="0.9"/>
  <text x="80" y="677" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="#67e8f9">CARRELAGE &amp; FAÏENCES</text>
  <text x="80" y="702" font-family="Arial, sans-serif" font-size="15" fill="#22d3ee" fill-opacity="0.8">Pose de carreaux sol et mur — MonChantier</text>
</svg>
