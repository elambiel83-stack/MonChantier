<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Bureau d'études — MonChantier</title>
  <desc id="desc">Plans, devis et études techniques de construction</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="blueprintBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="6" dy="10" stdDeviation="16" flood-color="#00000060"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="1200" height="720" fill="url(#bgGrad)"/>
  <!-- Étoiles/points décoratifs -->
  <circle cx="80" cy="60" r="2" fill="#a5b4fc" opacity="0.6"/>
  <circle cx="200" cy="120" r="1.5" fill="#a5b4fc" opacity="0.4"/>
  <circle cx="1050" cy="80" r="2" fill="#a5b4fc" opacity="0.5"/>
  <circle cx="1150" cy="200" r="1.5" fill="#a5b4fc" opacity="0.4"/>
  <circle cx="950" cy="600" r="2" fill="#a5b4fc" opacity="0.3"/>

  <!-- === PLAN BLUEPRINT (feuille principale) === -->
  <g filter="url(#shadow)">
    <!-- Feuille -->
    <rect x="120" y="80" width="680" height="520" rx="8" fill="url(#blueprintBg)"/>
    <!-- Coins repliés -->
    <polygon points="120,80 180,80 120,140" fill="#1e3a8a"/>

    <!-- Grille blueprint -->
    <!-- Lignes verticales -->
    <line x1="190" y1="90" x2="190" y2="590" stroke="#93c5fd" stroke-width="0.6" stroke-opacity="0.3"/>
    <line x1="250" y1="90" x2="250" y2="590" stroke="#93c5fd" stroke-width="0.6" stroke-opacity="0.3"/>
    <line x1="310" y1="90" x2="310" y2="590" stroke="#93c5fd" stroke-width="0.6" stroke-opacity="0.3"/>
    <line x1="370" y1="90" x2="370" y2="590" stroke="#93c5fd" stroke-width="0.6" stroke-opacity="0.3"/>
    <line x1="430" y1="90" x2="430" y2="590" stroke="#93c5fd" stroke-width="0.6" stroke-opacity="0.3"/>
    <line x1="490" y1="90" x2="490" y2="590" stroke="#93c5fd" stroke-width="0.6" stroke-opacity="0.3"/>
    <line x1="550" y1="90" x2="550" y2="590" stroke="#93c5fd" stroke-width="0.6" stroke-opacity="0.3"/>
    <line x1="610" y1="90" x2="610" y2="590" stroke="#93c5fd" stroke-width="0.6" stroke-opacity="0.3"/>
    <line x1="670" y1="90" x2="670" y2="590" stroke="#93c5fd" stroke-width="0.6" stroke-opacity="0.3"/>
    <line x1="730" y1="90" x2="730" y2="590" stroke="#93c5fd" stroke-width="0.6" stroke-opacity="0.3"/>
    <!-- Lignes horizontales -->
    <line x1="130" y1="150" x2="790" y2="150" stroke="#93c5fd" stroke-width="0.6" stroke-opacity="0.3"/>
    <line x1="130" y1="210" x2="790" y2="210" stroke="#93c5fd" stroke-width="0.6" stroke-opacity="0.3"/>
    <line x1="130" y1="270" x2="790" y2="270" stroke="#93c5fd" stroke-width="0.6" stroke-opacity="0.3"/>
    <line x1="130" y1="330" x2="790" y2="330" stroke="#93c5fd" stroke-width="0.6" stroke-opacity="0.3"/>
    <line x1="130" y1="390" x2="790" y2="390" stroke="#93c5fd" stroke-width="0.6" stroke-opacity="0.3"/>
    <line x1="130" y1="450" x2="790" y2="450" stroke="#93c5fd" stroke-width="0.6" stroke-opacity="0.3"/>
    <line x1="130" y1="510" x2="790" y2="510" stroke="#93c5fd" stroke-width="0.6" stroke-opacity="0.3"/>

    <!-- Plan de maison dessiné -->
    <!-- Mur extérieur -->
    <rect x="170" y="140" width="580" height="380" rx="4" fill="none" stroke="white" stroke-width="4"/>
    <!-- Murs intérieurs -->
    <!-- Séparation horizontale médiane -->
    <line x1="170" y1="320" x2="580" y2="320" stroke="white" stroke-width="3"/>
    <!-- Séparation verticale -->
    <line x1="420" y1="140" x2="420" y2="520" stroke="white" stroke-width="3"/>
    <!-- Séparation petite pièce -->
    <line x1="420" y1="420" x2="750" y2="420" stroke="white" stroke-width="3"/>
    <!-- Portes -->
    <path d="M 390,320 A 30,30 0 0,0 420,290" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="none"/>
    <path d="M 420,190 A 30,30 0 0,1 450,220" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <path d="M 390,520 A 30,30 0 0,0 420,490" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <!-- Fenêtres -->
    <rect x="170" y="200" width="0" height="0" fill="none"/>
    <line x1="170" y1="200" x2="170" y2="260" stroke="#93c5fd" stroke-width="6"/>
    <line x1="170" y1="400" x2="170" y2="450" stroke="#93c5fd" stroke-width="6"/>
    <line x1="500" y1="140" x2="600" y2="140" stroke="#93c5fd" stroke-width="6"/>
    <line x1="230" y1="140" x2="330" y2="140" stroke="#93c5fd" stroke-width="6"/>
    <line x1="750" y1="200" x2="750" y2="260" stroke="#93c5fd" stroke-width="6"/>
    <line x1="750" y1="360" x2="750" y2="420" stroke="#93c5fd" stroke-width="6"/>
    <!-- Labels des pièces -->
    <text x="285" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#bfdbfe" font-weight="600">SALON</text>
    <text x="580" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#bfdbfe">CUISINE</text>
    <text x="285" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#bfdbfe">CHAMBRE 1</text>
    <text x="575" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#bfdbfe">CHAMBRE 2</text>
    <text x="590" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#93c5fd">BAIN</text>

    <!-- Cotes/mesures -->
    <line x1="130" y1="140" x2="130" y2="520" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="125" y1="140" x2="135" y2="140" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="125" y1="520" x2="135" y2="520" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="115" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#fbbf24" transform="rotate(-90,115,335)">12.00 m</text>
    <line x1="170" y1="560" x2="750" y2="560" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="170" y1="555" x2="170" y2="565" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="750" y1="555" x2="750" y2="565" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="460" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#fbbf24">18.00 m</text>

    <!-- Cartouche en bas -->
    <rect x="520" y="530" width="250" height="50" rx="4" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1"/>
    <text x="645" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#bfdbfe">MONCHANTIER — KOLWEZI</text>
    <text x="645" y="568" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#93c5fd">PLAN R+0 · ÉCHELLE 1/100</text>
  </g>

  <!-- === RÈGLE À DROITE === -->
  <g transform="translate(870, 100)">
    <!-- Corps règle -->
    <rect x="0" y="0" width="50" height="480" rx="6" fill="#fcd34d"/>
    <rect x="4" y="4" width="42" height="472" rx="4" fill="#fef3c7"/>
    <!-- Graduations -->
    <line x1="4" y1="20" x2="46" y2="20" stroke="#92400e" stroke-width="1.5"/>
    <line x1="4" y1="40" x2="36" y2="40" stroke="#92400e" stroke-width="1"/>
    <line x1="4" y1="60" x2="36" y2="60" stroke="#92400e" stroke-width="1"/>
    <line x1="4" y1="80" x2="36" y2="80" stroke="#92400e" stroke-width="1"/>
    <line x1="4" y1="100" x2="46" y2="100" stroke="#92400e" stroke-width="1.5"/>
    <line x1="4" y1="120" x2="36" y2="120" stroke="#92400e" stroke-width="1"/>
    <line x1="4" y1="140" x2="36" y2="140" stroke="#92400e" stroke-width="1"/>
    <line x1="4" y1="160" x2="36" y2="160" stroke="#92400e" stroke-width="1"/>
    <line x1="4" y1="180" x2="46" y2="180" stroke="#92400e" stroke-width="1.5"/>
    <line x1="4" y1="200" x2="36" y2="200" stroke="#92400e" stroke-width="1"/>
    <line x1="4" y1="220" x2="36" y2="220" stroke="#92400e" stroke-width="1"/>
    <line x1="4" y1="240" x2="36" y2="240" stroke="#92400e" stroke-width="1"/>
    <line x1="4" y1="260" x2="46" y2="260" stroke="#92400e" stroke-width="1.5"/>
    <line x1="4" y1="280" x2="36" y2="280" stroke="#92400e" stroke-width="1"/>
    <line x1="4" y1="300" x2="36" y2="300" stroke="#92400e" stroke-width="1"/>
    <line x1="4" y1="320" x2="36" y2="320" stroke="#92400e" stroke-width="1"/>
    <line x1="4" y1="340" x2="46" y2="340" stroke="#92400e" stroke-width="1.5"/>
    <line x1="4" y1="360" x2="36" y2="360" stroke="#92400e" stroke-width="1"/>
    <line x1="4" y1="380" x2="36" y2="380" stroke="#92400e" stroke-width="1"/>
    <line x1="4" y1="400" x2="36" y2="400" stroke="#92400e" stroke-width="1"/>
    <line x1="4" y1="420" x2="46" y2="420" stroke="#92400e" stroke-width="1.5"/>
    <line x1="4" y1="440" x2="36" y2="440" stroke="#92400e" stroke-width="1"/>
    <line x1="4" y1="460" x2="36" y2="460" stroke="#92400e" stroke-width="1"/>
    <!-- Chiffres -->
    <text x="25" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#92400e">1</text>
    <text x="25" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#92400e">2</text>
    <text x="25" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#92400e">3</text>
    <text x="25" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#92400e">4</text>
    <text x="25" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#92400e">5</text>
    <text x="25" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#92400e">6</text>
  </g>

  <!-- === COMPAS === -->
  <g transform="translate(960, 350)">
    <!-- Jambe 1 -->
    <line x1="30" y1="0" x2="0" y2="200" stroke="#c4b5fd" stroke-width="6" stroke-linecap="round"/>
    <!-- Jambe 2 -->
    <line x1="30" y1="0" x2="70" y2="200" stroke="#c4b5fd" stroke-width="6" stroke-linecap="round"/>
    <!-- Charnière -->
    <circle cx="30" cy="0" r="10" fill="#7c3aed"/>
    <circle cx="30" cy="0" r="5" fill="#c4b5fd"/>
    <!-- Pointe gauche -->
    <line x1="0" y1="200" x2="-5" y2="230" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>
    <!-- Crayon droit -->
    <rect x="60" y="195" width="16" height="40" rx="3" fill="#fcd34d"/>
    <polygon points="60,235 76,235 68,255" fill="#f97316"/>
    <circle cx="68" cy="257" r="3" fill="#1e293b"/>
    <!-- Arc tracé -->
    <path d="M 0,200 A 70,70 0 0,1 140,200" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="8,4" opacity="0.7"/>
  </g>

  <!-- Bandeau titre bas -->
  <rect x="0" y="630" width="1200" height="90" fill="#1e1b4b" fill-opacity="0.85"/>
  <text x="80" y="675" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="#a5b4fc">BUREAU D'ÉTUDES</text>
  <text x="80" y="700" font-family="Arial, sans-serif" font-size="15" fill="#6366f1" fill-opacity="0.8">Plans · Devis · Études techniques — MonChantier</text>
</svg>
