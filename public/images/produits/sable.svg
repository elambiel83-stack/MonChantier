<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#F8F9FA"/>
  
  <!-- Sand pile -->
  <defs>
    <linearGradient id="sandGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FDE68A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main sand cone -->
  <path d="M 200 80 L 350 240 L 50 240 Z" fill="url(#sandGradient)" stroke="#D97706" stroke-width="2"/>
  
  <!-- Sand texture (small particles) -->
  <circle cx="150" cy="200" r="2" fill="#D97706" opacity="0.6"/>
  <circle cx="180" cy="190" r="1.5" fill="#D97706" opacity="0.6"/>
  <circle cx="200" cy="150" r="2" fill="#D97706" opacity="0.6"/>
  <circle cx="220" cy="170" r="1.5" fill="#D97706" opacity="0.6"/>
  <circle cx="240" cy="200" r="2" fill="#D97706" opacity="0.6"/>
  <circle cx="260" cy="210" r="1.5" fill="#D97706" opacity="0.6"/>
  <circle cx="170" cy="220" r="2" fill="#B45309" opacity="0.5"/>
  <circle cx="210" cy="195" r="1.5" fill="#B45309" opacity="0.5"/>
  <circle cx="250" cy="190" r="2" fill="#B45309" opacity="0.5"/>
  
  <!-- Base shadow -->
  <ellipse cx="200" cy="240" rx="150" ry="15" fill="#D97706" opacity="0.3"/>
  
  <!-- Highlight on top -->
  <path d="M 200 80 L 230 130 L 170 130 Z" fill="#FEF3C7" opacity="0.5"/>
</svg>
