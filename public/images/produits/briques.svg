<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#F8F9FA"/>
  
  <!-- Brick stack -->
  <!-- Bottom row -->
  <rect x="80" y="200" width="80" height="40" fill="#B84F3E" stroke="#8B3A2E" stroke-width="2"/>
  <rect x="165" y="200" width="80" height="40" fill="#C45A47" stroke="#8B3A2E" stroke-width="2"/>
  <rect x="250" y="200" width="80" height="40" fill="#B84F3E" stroke="#8B3A2E" stroke-width="2"/>
  
  <!-- Middle row -->
  <rect x="40" y="155" width="80" height="40" fill="#C45A47" stroke="#8B3A2E" stroke-width="2"/>
  <rect x="125" y="155" width="80" height="40" fill="#B84F3E" stroke="#8B3A2E" stroke-width="2"/>
  <rect x="210" y="155" width="80" height="40" fill="#C45A47" stroke="#8B3A2E" stroke-width="2"/>
  <rect x="295" y="155" width="80" height="40" fill="#B84F3E" stroke="#8B3A2E" stroke-width="2"/>
  
  <!-- Top row -->
  <rect x="80" y="110" width="80" height="40" fill="#B84F3E" stroke="#8B3A2E" stroke-width="2"/>
  <rect x="165" y="110" width="80" height="40" fill="#C45A47" stroke="#8B3A2E" stroke-width="2"/>
  <rect x="250" y="110" width="80" height="40" fill="#B84F3E" stroke="#8B3A2E" stroke-width="2"/>
  
  <!-- Very top -->
  <rect x="125" y="65" width="80" height="40" fill="#C45A47" stroke="#8B3A2E" stroke-width="2"/>
  <rect x="210" y="65" width="80" height="40" fill="#B84F3E" stroke="#8B3A2E" stroke-width="2"/>
  
  <!-- Shadows and details -->
  <rect x="80" y="200" width="80" height="5" fill="#8B3A2E" opacity="0.3"/>
  <rect x="165" y="200" width="80" height="5" fill="#8B3A2E" opacity="0.3"/>
  <rect x="250" y="200" width="80" height="5" fill="#8B3A2E" opacity="0.3"/>
</svg>
