<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#F8F9FA"/>
  
  <!-- Paver pattern (interlocking pavers) -->
  <defs>
    <linearGradient id="paverGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#94A3B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64748B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="paverGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#CBD5E1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#94A3B8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Row 1 -->
  <rect x="50" y="50" width="60" height="40" fill="url(#paverGrad1)" stroke="#475569" stroke-width="2" rx="2"/>
  <rect x="115" y="50" width="60" height="40" fill="url(#paverGrad2)" stroke="#475569" stroke-width="2" rx="2"/>
  <rect x="180" y="50" width="60" height="40" fill="url(#paverGrad1)" stroke="#475569" stroke-width="2" rx="2"/>
  <rect x="245" y="50" width="60" height="40" fill="url(#paverGrad2)" stroke="#475569" stroke-width="2" rx="2"/>
  <rect x="310" y="50" width="60" height="40" fill="url(#paverGrad1)" stroke="#475569" stroke-width="2" rx="2"/>
  
  <!-- Row 2 (offset) -->
  <rect x="20" y="95" width="60" height="40" fill="url(#paverGrad2)" stroke="#475569" stroke-width="2" rx="2"/>
  <rect x="85" y="95" width="60" height="40" fill="url(#paverGrad1)" stroke="#475569" stroke-width="2" rx="2"/>
  <rect x="150" y="95" width="60" height="40" fill="url(#paverGrad2)" stroke="#475569" stroke-width="2" rx="2"/>
  <rect x="215" y="95" width="60" height="40" fill="url(#paverGrad1)" stroke="#475569" stroke-width="2" rx="2"/>
  <rect x="280" y="95" width="60" height="40" fill="url(#paverGrad2)" stroke="#475569" stroke-width="2" rx="2"/>
  <rect x="345" y="95" width="40" height="40" fill="url(#paverGrad1)" stroke="#475569" stroke-width="2" rx="2"/>
  
  <!-- Row 3 -->
  <rect x="50" y="140" width="60" height="40" fill="url(#paverGrad1)" stroke="#475569" stroke-width="2" rx="2"/>
  <rect x="115" y="140" width="60" height="40" fill="url(#paverGrad2)" stroke="#475569" stroke-width="2" rx="2"/>
  <rect x="180" y="140" width="60" height="40" fill="url(#paverGrad1)" stroke="#475569" stroke-width="2" rx="2"/>
  <rect x="245" y="140" width="60" height="40" fill="url(#paverGrad2)" stroke="#475569" stroke-width="2" rx="2"/>
  <rect x="310" y="140" width="60" height="40" fill="url(#paverGrad1)" stroke="#475569" stroke-width="2" rx="2"/>
  
  <!-- Row 4 (offset) -->
  <rect x="20" y="185" width="60" height="40" fill="url(#paverGrad2)" stroke="#475569" stroke-width="2" rx="2"/>
  <rect x="85" y="185" width="60" height="40" fill="url(#paverGrad1)" stroke="#475569" stroke-width="2" rx="2"/>
  <rect x="150" y="185" width="60" height="40" fill="url(#paverGrad2)" stroke="#475569" stroke-width="2" rx="2"/>
  <rect x="215" y="185" width="60" height="40" fill="url(#paverGrad1)" stroke="#475569" stroke-width="2" rx="2"/>
  <rect x="280" y="185" width="60" height="40" fill="url(#paverGrad2)" stroke="#475569" stroke-width="2" rx="2"/>
  
  <!-- Row 5 -->
  <rect x="50" y="230" width="60" height="50" fill="url(#paverGrad1)" stroke="#475569" stroke-width="2" rx="2"/>
  <rect x="115" y="230" width="60" height="50" fill="url(#paverGrad2)" stroke="#475569" stroke-width="2" rx="2"/>
  <rect x="180" y="230" width="60" height="50" fill="url(#paverGrad1)" stroke="#475569" stroke-width="2" rx="2"/>
  <rect x="245" y="230" width="60" height="50" fill="url(#paverGrad2)" stroke="#475569" stroke-width="2" rx="2"/>
  <rect x="310" y="230" width="60" height="50" fill="url(#paverGrad1)" stroke="#475569" stroke-width="2" rx="2"/>
</svg>
